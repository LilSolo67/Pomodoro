      radial-gradient(circle at 50% 0%, var(--highlight), transparent 60%);

  .masthead h1 {
    margin: 0;
    font-family: 'Big Shoulders Display', ui-sans-serif, sans-serif;
    font-weight: 800;
    font-size: 2.2rem;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    text-wrap: balance;
  }
  .masthead .sub {
    font-size: 0.8rem;
    color: var(--ink-dim);

  .panel {
    background: var(--panel);
    border-radius: 1.25rem;

  .dial-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .tick { stroke: var(--ink-faint); stroke-width: 1; }
  .tick-major { stroke: var(--brass); stroke-width: 2; }
  .track { fill: none; stroke: var(--panel-raised); stroke-width: 10; }

  .bar .seg-work i, .bar .seg-break i {

  .btn {

  .btn:active { transform: translateY(1px); }
  .btn-primary {

  .btn-primary.break { background: var(--break); box-shadow: 0 0.4rem 0.9rem var(--break-dim); }
  .btn-primary:hover { filter: brightness(1.06); }
  .btn-ghost {
    background: var(--panel-raised);

  .btn-ghost:hover { filter: brightness(1.08); }
  .btn:focus-visible, .icon-btn:focus-visible, .link-btn:focus-visible {
    outline: 2px solid var(--brass);

<div class="app">
  <div class="masthead">
    <div class="eyebrow">Focus Timer</div>
    <h1>Pomodoro</h1>
    <div class="sub">25 min work · 5 min break · ×3</div>
  </div>

  <div class="panel">
    <div class="dial-wrap">
      <svg class="dial-svg" viewBox="0 0 200 200" aria-hidden="true">
        <g id="ticks"></g>
        <circle class="track" cx="100" cy="100" r="82"></circle>
        <circle id="progressRing" class="progress work" cx="100" cy="100" r="82"
          stroke-dasharray="515.2" stroke-dashoffset="0"></circle>
      </svg>
      <div class="dial-center">
        <div class="phase-tag" id="phaseTag">Work</div>
        <div class="time" id="timeDisplay" role="timer" aria-live="off">25:00</div>
        <div class="cycle-label" id="cycleLabel">Cycle 1 of 3</div>
      </div>
    </div>

    <div class="cycle-track" id="cycleTrack" aria-hidden="true"></div>

    <div class="controls">
      <button class="btn btn-primary" id="toggleBtn">
        <svg id="toggleIcon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
          <path d="M8 5v14l11-7z"></path>
        </svg>
        <span id="toggleLabel">Start</span>
      </button>
      <button class="btn btn-ghost" id="resetBtn">Reset</button>
    </div>

    <div class="footer-row">
      <button class="icon-btn" id="muteBtn" aria-pressed="false" aria-label="Mute bell">
        <svg id="muteIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9v6h4l5 5V4L8 9H4z"></path>
          <path d="M16 8.5a5 5 0 0 1 0 7"></path>
          <path d="M18.5 6a8.5 8.5 0 0 1 0 12"></path>
        </svg>
      </button>
      <button class="link-btn" id="skipBtn">Skip phase</button>
    </div>

    <div class="status-line" id="statusLine" aria-live="polite"></div>
  </div>
</div>

<script>
(function () {
  var WORK = 25 * 60;
  var BREAK = 5 * 60;
  var CYCLES = 3;

  var phases = [];
  for (var c = 0; c < CYCLES; c++) {
    phases.push({ type: 'work', dur: WORK, cycle: c });
    phases.push({ type: 'break', dur: BREAK, cycle: c });
  }

  var phaseIndex = 0;
  var remaining = phases[0].dur;
  var running = false;
  var timerId = null;
  var muted = false;
  var complete = false;
  var audioCtx = null;

  var ringEl = document.getElementById('progressRing');
  var timeEl = document.getElementById('timeDisplay');
  var phaseTagEl = document.getElementById('phaseTag');
  var cycleLabelEl = document.getElementById('cycleLabel');
  var toggleBtn = document.getElementById('toggleBtn');
  var toggleLabel = document.getElementById('toggleLabel');
  var toggleIcon = document.getElementById('toggleIcon');
  var resetBtn = document.getElementById('resetBtn');
  var skipBtn = document.getElementById('skipBtn');
  var muteBtn = document.getElementById('muteBtn');
  var statusLine = document.getElementById('statusLine');
  var cycleTrack = document.getElementById('cycleTrack');
  var ticksGroup = document.getElementById('ticks');

  var CIRC = 2 * Math.PI * 82;

  function buildTicks() {
    var html = '';
    for (var i = 0; i < 40; i++) {
      var angle = (i / 40) * 360;
      var major = i % 5 === 0;
      var r1 = major ? 68 : 72;
      var r2 = 78;
      var rad = (angle * Math.PI) / 180;
      var x1 = 100 + r1 * Math.cos(rad);
      var y1 = 100 + r1 * Math.sin(rad);
      var x2 = 100 + r2 * Math.cos(rad);
      var y2 = 100 + r2 * Math.sin(rad);
      html += '<line class="' + (major ? 'tick-major' : 'tick') + '" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"></line>';
    }
    ticksGroup.innerHTML = html;
  }
  buildTicks();

  function buildCycleTrack() {
    var html = '';
    for (var c = 0; c < CYCLES; c++) {
      html +=
        '<div class="cyc" id="cyc-' + c + '">' +
          '<div class="n">Cycle ' + (c + 1) + '</div>' +
          '<div class="bar">' +
            '<div class="seg-work"><i id="cyc-' + c + '-work"></i></div>' +
            '<div class="seg-break"><i id="cyc-' + c + '-break"></i></div>' +
          '</div>' +
        '</div>';
    }
    cycleTrack.innerHTML = html;
  }
  buildCycleTrack();

  function fmt(sec) {
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }

  function ensureAudio() {
    if (!audioCtx) {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      audioCtx = new Ctx();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function chime(kind) {
    if (muted) return;
    try {
      ensureAudio();
      var now = audioCtx.currentTime;
      var freqs = kind === 'work' ? [880, 1108.7] : [659.3, 987.8];
      freqs.forEach(function (f, idx) {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = f;
        var t0 = now + idx * 0.14;
        gain.gain.setValueAtTime(0, t0);
        gain.gain.linearRampToValueAtTime(0.18, t0 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.5);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t0);
        osc.stop(t0 + 0.55);
      });
    } catch (e) {}
  }

  function updateCycleTrack() {
    for (var c = 0; c < CYCLES; c++) {
      var wEl = document.getElementById('cyc-' + c + '-work');
      var bEl = document.getElementById('cyc-' + c + '-break');
      var cEl = document.getElementById('cyc-' + c);
      var wPct = 0, bPct = 0;
      var current = phases[phaseIndex];
      if (c < current.cycle || (c === current.cycle && current.type === 'break')) {
        wPct = 100;
      }
      if (c === current.cycle && current.type === 'work') {
        wPct = ((current.dur - remaining) / current.dur) * 100;
      }
      if (c < current.cycle) {
        bPct = 100;
      }
      if (c === current.cycle && current.type === 'break') {
        bPct = ((current.dur - remaining) / current.dur) * 100;
      }
      if (complete) { wPct = 100; bPct = 100; }
      wEl.style.width = wPct + '%';
      bEl.style.width = bPct + '%';
      cEl.classList.toggle('active', c === current.cycle && !complete);
    }
  }

  function render() {
    var phase = phases[phaseIndex];
    timeEl.textContent = complete ? '--:--' : fmt(remaining);
    var isWork = phase.type === 'work';
    phaseTagEl.textContent = complete ? 'Done' : (isWork ? 'Work' : 'Break');
    phaseTagEl.classList.toggle('break', !isWork);
    ringEl.classList.toggle('work', isWork);
    ringEl.classList.toggle('break', !isWork);
    toggleBtn.classList.toggle('break', !isWork);

    var frac = complete ? 1 : (phase.dur - remaining) / phase.dur;
    ringEl.setAttribute('stroke-dasharray', CIRC);
    ringEl.setAttribute('stroke-dashoffset', CIRC * frac);

    cycleLabelEl.textContent = complete
      ? '3 cycles complete'
      : 'Cycle ' + (phase.cycle + 1) + ' of ' + CYCLES;

    toggleLabel.textContent = complete ? 'Restart' : (running ? 'Pause' : 'Start');
    toggleIcon.innerHTML = running
      ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"></path>'
      : '<path d="M8 5v14l11-7z"></path>';

    skipBtn.style.visibility = complete ? 'hidden' : 'visible';
    document.title = complete ? 'Done — Pomodoro' : (fmt(remaining) + ' · ' + (isWork ? 'Work' : 'Break'));

    updateCycleTrack();
  }

  function advancePhase() {
    var finishedType = phases[phaseIndex].type;
    phaseIndex++;
    if (phaseIndex >= phases.length) {
      complete = true;
      running = false;
      clearInterval(timerId);
      statusLine.textContent = '3 cycles complete — nice work.';
      chime('work');
      render();
      return;
    }
    remaining = phases[phaseIndex].dur;
    chime(finishedType === 'work' ? 'break' : 'work');
    statusLine.textContent = phases[phaseIndex].type === 'work' ? 'Back to work.' : 'Take a break.';
    render();
  }

  function tick() {
    remaining--;
    if (remaining < 0) {
      advancePhase();
    } else {
      render();
    }
  }

  function start() {
    if (complete) {
      resetAll();
    }
    if (running) return;
    running = true;
    statusLine.textContent = '';
    timerId = setInterval(tick, 1000);
    render();
  }

  function pause() {
    running = false;
    clearInterval(timerId);
    render();
  }

  function resetAll() {
    clearInterval(timerId);
    running = false;
    complete = false;
    phaseIndex = 0;
    remaining = phases[0].dur;
    statusLine.textContent = '';
    render();
  }

  toggleBtn.addEventListener('click', function () {
    ensureAudio();
    if (complete) { resetAll(); return; }
    if (running) pause(); else start();
  });

  resetBtn.addEventListener('click', function () {
    resetAll();
  });

  skipBtn.addEventListener('click', function () {
    if (complete) return;
    remaining = 0;
    if (!running) render();
    advancePhase();
  });

  muteBtn.addEventListener('click', function () {
    muted = !muted;
    muteBtn.setAttribute('aria-pressed', String(muted));
    muteBtn.style.color = muted ? 'var(--work)' : '';
    muteIconSet(muted);
  });

  function muteIconSet(isMuted) {
    var icon = document.getElementById('muteIcon');
    icon.innerHTML = isMuted
      ? '<path d="M4 9v6h4l5 5V4L8 9H4z"></path><line x1="16" y1="9" x2="21" y2="14"></line><line x1="21" y1="9" x2="16" y2="14"></line>'
      : '<path d="M4 9v6h4l5 5V4L8 9H4z"></path><path d="M16 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 6a8.5 8.5 0 0 1 0 12"></path>';
  }

  render();
})();
</script>
